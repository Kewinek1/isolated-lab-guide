<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">One capable router — Site A</title><desc id="diagram-desc">One maintained firewall can separate home, management, services and targets using independent ports or properly configured VLANs. A consumer DMZ-host checkbox does not provide these zones.</desc><rect width="1100" height="470" fill="white"/><rect x="20" y="30" width="275" height="405" fill="#f5f5f3" stroke="#bbb"/><text x="35" y="54" font-size="9" font-family="monospace" letter-spacing="1.2">TRUSTED HOME ZONE</text><rect x="695" y="30" width="385" height="240" fill="#f5f5f3" stroke="#bbb"/><text x="710" y="54" font-size="9" font-family="monospace" letter-spacing="1.2">UNTRUSTED TARGET ZONE</text><rect x="695" y="290" width="385" height="145" fill="#f5f5f3" stroke="#bbb"/><text x="710" y="314" font-size="9" font-family="monospace" letter-spacing="1.2">RELAY / SEPARATE ZONE</text><path d="M247 178 L430 178" fill="none" stroke="#111" stroke-width="1.3" /><text x="338.5" y="168" text-anchor="middle" font-size="9" fill="#555">Separate port / VLAN</text><path d="M625 178 L755 178" fill="none" stroke="#111" stroke-width="1.3" /><text x="690" y="168" text-anchor="middle" font-size="9" fill="#555">Filtered</text><path d="M526 222 L526 370" fill="none" stroke="#111" stroke-width="1.3" /><path d="M526 370 L755 370" fill="none" stroke="#111" stroke-width="1.3" /><text x="640.5" y="360" text-anchor="middle" font-size="9" fill="#555">Specific permission</text><g data-node="home" color="#111"><rect x="52" y="134" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(67 154) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 19-16 19 16M7 15v23h28V15M17 38V25h8v13"/></g><text x="113" y="170" fill="#111" font-size="12" font-weight="600">Home devices</text><text x="113" y="191" fill="#111" font-size="9" font-family="monospace">Protected zone</text></g><g data-node="firewall" color="#111"><rect x="430" y="134" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(445 154) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 38 10v13q-2 10-17 17Q6 33 4 23V10z"/><path d="m12 21 6 6 12-13"/></g><text x="491" y="170" fill="#111" font-size="12" font-weight="600">Trusted firewall</text><text x="491" y="191" fill="#111" font-size="9" font-family="monospace">One maintained gateway</text></g><g data-node="target" color="#111"><rect x="755" y="134" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(770 154) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="2" width="22" height="36" rx="2"/><rect x="16" y="15" width="10" height="10"/><path d="M16 2v6h10V2M5 11h5m-5 7h5m-5 7h5m-5 7h5m22-21h5m-5 7h5m-5 7h5m-5 7h5"/></g><text x="816" y="170" fill="#111" font-size="12" font-weight="600">Lab targets</text><text x="816" y="191" fill="#111" font-size="9" font-family="monospace">10.77.10.0/24</text></g><g data-node="relay" color="#111"><rect x="755" y="327" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(770 347) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="28" height="36"/><path d="M7 14h28M7 26h28M13 8h3m-3 12h3m-3 12h3m7-24h6m-6 12h6m-6 12h6"/></g><text x="816" y="363" fill="#111" font-size="12" font-weight="600">Dedicated relay</text><text x="816" y="384" fill="#111" font-size="9" font-family="monospace">10.78.10.0/24</text></g><text x="487" y="64" font-size="11">Internet uplink</text><path d="M526 73 L526 134" fill="none" stroke="#111" stroke-width="1.3" /><text x="485" y="281" font-size="11">× Targets → home / internet</text><text x="25" y="490" font-size="10" fill="#555">PUBLIC EXAMPLE · ALL ADDRESSES FICTIONAL · One capable router</text></svg>
