<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Understand DMZ — Site A</title><desc id="diagram-desc">A consumer DMZ host forwards unsolicited incoming traffic to one device. It does not create a separate security zone or stop a compromised device from contacting the home LAN.</desc><rect width="1100" height="470" fill="white"/><rect x="20" y="250" width="1060" height="185" fill="#f5f5f3" stroke="#bbb"/><text x="35" y="274" font-size="9" font-family="monospace" letter-spacing="1.2">SAME HOME LAN / NO ISOLATION CREATED</text><path d="M275 118 L450 118" fill="none" stroke="#111" stroke-width="1.3" /><text x="362.5" y="108" text-anchor="middle" font-size="9" fill="#555">Public incoming traffic</text><path d="M548 162 L548 306" fill="none" stroke="#111" stroke-width="1.3" /><path d="M548 350 L788 350" fill="none" stroke="#111" stroke-width="1.3" /><text x="668" y="340" text-anchor="middle" font-size="9" fill="#555">Broad forwarding</text><path d="M188 350 L450 350" fill="none" stroke="#111" stroke-width="1.3" /><text x="319" y="340" text-anchor="middle" font-size="9" fill="#555">Same LAN</text><g data-node="internet" color="#111"><rect x="80" y="74" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(95 94) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="18"/><ellipse cx="21" cy="21" rx="8" ry="18"/><path d="M3 21h36M7 10h28M7 32h28"/></g><text x="141" y="110" fill="#111" font-size="12" font-weight="600">Internet</text><text x="141" y="131" fill="#111" font-size="9" font-family="monospace">Unsolicited traffic</text></g><g data-node="home" color="#111"><rect x="450" y="74" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(465 94) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="17" width="38" height="15" rx="2"/><path d="M8 17V4m26 13V4M8 26h1m6 0h1m6 0h1"/><path d="M4 7q4-6 8 0M30 7q4-6 8 0"/></g><text x="511" y="110" fill="#111" font-size="12" font-weight="600">Home router</text><text x="511" y="131" fill="#111" font-size="9" font-family="monospace">Consumer DMZ setting</text></g><g data-node="labrouter" color="#111"><rect x="450" y="306" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(465 326) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="17" width="38" height="15" rx="2"/><path d="M8 17V4m26 13V4M8 26h1m6 0h1m6 0h1"/><path d="M4 7q4-6 8 0M30 7q4-6 8 0"/></g><text x="511" y="342" fill="#111" font-size="12" font-weight="600">Experimental router</text><text x="511" y="363" fill="#111" font-size="9" font-family="monospace">WAN on the home LAN</text></g><g data-node="target" color="#111"><rect x="788" y="306" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(803 326) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="28" height="36"/><path d="M7 14h28M7 26h28M13 8h3m-3 12h3m-3 12h3m7-24h6m-6 12h6m-6 12h6"/></g><text x="849" y="342" fill="#111" font-size="12" font-weight="600">DMZ host</text><text x="849" y="363" fill="#111" font-size="9" font-family="monospace">Exposed device</text></g><g data-node="client" color="#111"><rect x="90" y="306" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(105 326) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 19-16 19 16M7 15v23h28V15M17 38V25h8v13"/></g><text x="151" y="342" fill="#111" font-size="12" font-weight="600">Home devices</text><text x="151" y="363" fill="#111" font-size="9" font-family="monospace">Still reachable upstream</text></g><text x="766" y="122" font-size="26">DMZ host ≠ isolated zone</text><text x="766" y="148" font-size="11">This drawing explains the failure, not a setup to deploy.</text><text x="25" y="490" font-size="10" fill="#555">PUBLIC EXAMPLE · ALL ADDRESSES FICTIONAL · Understand DMZ</text></svg>
