<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Firewall at the edge — Site A</title><desc id="diagram-desc">A pfSense or OPNsense gateway sits between the ISP and both home and lab. The home router&#39;s WAN uses its own filtered transit network; lab targets occupy separate ports or VLANs.</desc><rect width="1100" height="470" fill="white"/><rect x="20" y="270" width="310" height="175" fill="#f5f5f3" stroke="#bbb"/><text x="35" y="294" font-size="9" font-family="monospace" letter-spacing="1.2">HOME / SEPARATE TRANSIT</text><rect x="770" y="25" width="310" height="185" fill="#f5f5f3" stroke="#bbb"/><text x="785" y="49" font-size="9" font-family="monospace" letter-spacing="1.2">UNTRUSTED LAB</text><rect x="770" y="260" width="310" height="185" fill="#f5f5f3" stroke="#bbb"/><text x="785" y="284" font-size="9" font-family="monospace" letter-spacing="1.2">DEDICATED RELAY / SEPARATE ZONE</text><path d="M250 110 L425 110" fill="none" stroke="#111" stroke-width="1.3" /><text x="337.5" y="100" text-anchor="middle" font-size="9" fill="#555">ISP handoff</text><path d="M660 110 L795 110" fill="none" stroke="#111" stroke-width="1.3" /><text x="727.5" y="100" text-anchor="middle" font-size="9" fill="#555">LAB</text><path d="M480 154 L480 225" fill="none" stroke="#111" stroke-width="1.3" /><path d="M480 225 L175 225" fill="none" stroke="#111" stroke-width="1.3" /><text x="327.5" y="215" text-anchor="middle" font-size="9" fill="#555">10.81.10.0/24</text><path d="M175 225 L175 320" fill="none" stroke="#111" stroke-width="1.3" /><path d="M605 154 L605 245" fill="none" stroke="#111" stroke-width="1.3" /><path d="M605 245 L715 245" fill="none" stroke="#111" stroke-width="1.3" /><path d="M715 245 L715 360" fill="none" stroke="#111" stroke-width="1.3" /><path d="M715 360 L795 360" fill="none" stroke="#111" stroke-width="1.3" /><text x="755" y="350" text-anchor="middle" font-size="9" fill="#555">RELAY</text><g data-node="internet" color="#111"><rect x="55" y="66" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(70 86) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="18"/><ellipse cx="21" cy="21" rx="8" ry="18"/><path d="M3 21h36M7 10h28M7 32h28"/></g><text x="116" y="102" fill="#111" font-size="12" font-weight="600">Internet / ISP</text><text x="116" y="123" fill="#111" font-size="9" font-family="monospace">WAN connection</text></g><g data-node="firewall" color="#111"><rect x="425" y="66" width="235" height="88" fill="#fff" stroke="#111"/><g transform="translate(440 86) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 38 10v13q-2 10-17 17Q6 33 4 23V10z"/><path d="m12 21 6 6 12-13"/></g><text x="486" y="102" fill="#111" font-size="12" font-weight="600">Trusted firewall</text><text x="486" y="123" fill="#111" font-size="9" font-family="monospace">pfSense</text></g><g data-node="home" color="#111"><rect x="50" y="320" width="250" height="88" fill="#fff" stroke="#111"/><g transform="translate(65 340) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 19-16 19 16M7 15v23h28V15M17 38V25h8v13"/></g><text x="111" y="356" fill="#111" font-size="12" font-weight="600">Home router</text><text x="111" y="377" fill="#111" font-size="9" font-family="monospace">WAN 10.81.10.2</text></g><g data-node="target" color="#111"><rect x="795" y="66" width="260" height="88" fill="#fff" stroke="#111"/><g transform="translate(810 86) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="28" height="36"/><path d="M7 14h28M7 26h28M13 8h3m-3 12h3m-3 12h3m7-24h6m-6 12h6m-6 12h6"/></g><text x="856" y="102" fill="#111" font-size="12" font-weight="600">Linux Pi / lab targets</text><text x="856" y="123" fill="#111" font-size="9" font-family="monospace">10.77.10.0/24</text></g><g data-node="relay" color="#111"><rect x="795" y="316" width="260" height="88" fill="#fff" stroke="#111"/><g transform="translate(810 336) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="28" height="36"/><path d="M7 14h28M7 26h28M13 8h3m-3 12h3m-3 12h3m7-24h6m-6 12h6m-6 12h6"/></g><text x="856" y="352" fill="#111" font-size="12" font-weight="600">Trusted Linux relay</text><text x="856" y="373" fill="#111" font-size="9" font-family="monospace">10.78.10.2</text></g><text x="798" y="180" font-size="10">Docker shares the target host kernel.</text><text x="363" y="293" font-size="11">× LAB → HOME / WAN / other zones</text><text x="363" y="328" font-size="10">MGMT and clean SERVICES also need</text><text x="363" y="346" font-size="10">separate ports or configured VLANs.</text><text x="363" y="414" font-size="10">CrowdSec optional · rules enforce isolation</text><text x="25" y="490" font-size="10" fill="#555">PUBLIC EXAMPLE · ALL ADDRESSES FICTIONAL · Firewall at the edge</text></svg>
