<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Connect the sites — Site A</title><desc id="diagram-desc">A separate trusted firewall contains the targets. A dedicated relay accepts narrowly permitted encrypted connections; only an approved service crosses into the lab.</desc><rect width="1100" height="470" fill="white"/><rect x="20" y="262" width="280" height="176" fill="#f5f5f3" stroke="#bbb"/><text x="35" y="286" font-size="9" font-family="monospace" letter-spacing="1.2">PROTECTED HOME</text><rect x="340" y="262" width="335" height="176" fill="#f5f5f3" stroke="#bbb"/><text x="355" y="286" font-size="9" font-family="monospace" letter-spacing="1.2">TRUSTED BOUNDARY</text><rect x="715" y="262" width="365" height="176" fill="#f5f5f3" stroke="#bbb"/><text x="730" y="286" font-size="9" font-family="monospace" letter-spacing="1.2">TARGETS / NO INTERNET EGRESS</text><path d="M237 103 L400 103" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="6 5"/><text x="318.5" y="93" text-anchor="middle" font-size="9" fill="#555">Encrypted overlay</text><path d="M595 103 L815 103" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="6 5"/><text x="705" y="93" text-anchor="middle" font-size="9" fill="#555">Encrypted overlay</text><path d="M915 147 L915 229" fill="none" stroke="#111" stroke-width="1.3" /><path d="M915 229 L530 229" fill="none" stroke="#111" stroke-width="1.3" /><text x="722.5" y="219" text-anchor="middle" font-size="9" fill="#555">Relay → firewall → one permitted target</text><path d="M530 229 L530 327" fill="none" stroke="#111" stroke-width="1.3" /><path d="M245 371 L430 371" fill="none" stroke="#111" stroke-width="1.3" /><text x="337.5" y="361" text-anchor="middle" font-size="9" fill="#555">Uplink</text><path d="M625 371 L785 371" fill="none" stroke="#111" stroke-width="1.3" /><text x="705" y="361" text-anchor="middle" font-size="9" fill="#555">TCP 8080 only</text><g data-node="remote" color="#111"><rect x="42" y="59" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(57 79) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="30" height="23" rx="1"/><path d="M6 28 2 35h38l-4-7M17 32h8"/></g><text x="103" y="95" fill="#111" font-size="12" font-weight="600">Remote participant</text><text x="103" y="116" fill="#111" font-size="9" font-family="monospace">Site B / C</text></g><g data-node="internet" color="#111"><rect x="400" y="59" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(415 79) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="18"/><ellipse cx="21" cy="21" rx="8" ry="18"/><path d="M3 21h36M7 10h28M7 32h28"/></g><text x="461" y="95" fill="#111" font-size="12" font-weight="600">Private overlay</text><text x="461" y="116" fill="#111" font-size="9" font-family="monospace">Direct / relayed</text></g><g data-node="relay" color="#111"><rect x="815" y="59" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(830 79) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="28" height="36"/><path d="M7 14h28M7 26h28M13 8h3m-3 12h3m-3 12h3m7-24h6m-6 12h6m-6 12h6"/></g><text x="876" y="95" fill="#111" font-size="12" font-weight="600">Dedicated Linux relay</text><text x="876" y="116" fill="#111" font-size="9" font-family="monospace">10.78.10.2</text></g><g data-node="home" color="#111"><rect x="50" y="327" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(65 347) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 19-16 19 16M7 15v23h28V15M17 38V25h8v13"/></g><text x="111" y="363" fill="#111" font-size="12" font-weight="600">Home router</text><text x="111" y="384" fill="#111" font-size="9" font-family="monospace">WAN transport only</text></g><g data-node="firewall" color="#111"><rect x="430" y="327" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(445 347) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 38 10v13q-2 10-17 17Q6 33 4 23V10z"/><path d="m12 21 6 6 12-13"/></g><text x="491" y="363" fill="#111" font-size="12" font-weight="600">Trusted firewall</text><text x="491" y="384" fill="#111" font-size="9" font-family="monospace">Deny targets → uplink</text></g><g data-node="target" color="#111"><rect x="785" y="327" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(800 347) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="2" width="22" height="36" rx="2"/><rect x="16" y="15" width="10" height="10"/><path d="M16 2v6h10V2M5 11h5m-5 7h5m-5 7h5m-5 7h5m22-21h5m-5 7h5m-5 7h5m-5 7h5"/></g><text x="846" y="363" fill="#111" font-size="12" font-weight="600">Pico / lab target</text><text x="846" y="384" fill="#111" font-size="9" font-family="monospace">10.77.10.30:8080</text></g><text x="442" y="195" font-size="10">Relay has a separate interface / VLAN, never a bridge into home.</text><text x="25" y="490" font-size="10" fill="#555">PUBLIC EXAMPLE · ALL ADDRESSES FICTIONAL · Connect the sites</text></svg>
