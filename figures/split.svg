<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Separate ISP branches — Site A</title><desc id="diagram-desc">An ISP handoff feeds a WAN-only switch, then the home-router WAN and lab-firewall WAN separately. Each router needs its own ISP-authorized connection; this design is conditional on the service contract and handoff.</desc><rect width="1100" height="470" fill="white"/><rect x="20" y="275" width="310" height="170" fill="#f5f5f3" stroke="#bbb"/><text x="35" y="299" font-size="9" font-family="monospace" letter-spacing="1.2">PROTECTED HOME LAN</text><rect x="585" y="275" width="275" height="170" fill="#f5f5f3" stroke="#bbb"/><text x="600" y="299" font-size="9" font-family="monospace" letter-spacing="1.2">LAB SECURITY BOUNDARY</text><rect x="885" y="275" width="195" height="170" fill="#f5f5f3" stroke="#bbb"/><text x="900" y="299" font-size="9" font-family="monospace" letter-spacing="1.2">UNTRUSTED LAB</text><path d="M250 105 L410 105" fill="none" stroke="#111" stroke-width="1.3" /><text x="330" y="95" text-anchor="middle" font-size="9" fill="#555">ISP Ethernet handoff</text><path d="M520 149 L520 223" fill="none" stroke="#111" stroke-width="1.3" /><path d="M520 223 L175 223" fill="none" stroke="#111" stroke-width="1.3" /><text x="347.5" y="213" text-anchor="middle" font-size="9" fill="#555">ISP-authorized WAN 1</text><path d="M175 223 L175 315" fill="none" stroke="#111" stroke-width="1.3" /><path d="M520 223 L722 223" fill="none" stroke="#111" stroke-width="1.3" /><text x="621" y="213" text-anchor="middle" font-size="9" fill="#555">ISP-authorized WAN 2</text><path d="M722 223 L722 315" fill="none" stroke="#111" stroke-width="1.3" /><path d="M840 359 L895 359" fill="none" stroke="#111" stroke-width="1.3" /><g data-node="internet" color="#111"><rect x="55" y="61" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(70 81) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="18"/><ellipse cx="21" cy="21" rx="8" ry="18"/><path d="M3 21h36M7 10h28M7 32h28"/></g><text x="116" y="97" fill="#111" font-size="12" font-weight="600">Internet / ISP</text><text x="116" y="118" fill="#111" font-size="9" font-family="monospace">Two connections required</text></g><g data-node="switch" color="#111"><rect x="410" y="61" width="220" height="88" fill="#fff" stroke="#111"/><g transform="translate(425 81) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="11" width="38" height="24" rx="2"/><path d="M8 20h6v7H8zm10 0h6v7h-6zm10 0h6v7h-6M10 5h22m-4-3 4 3-4 3"/></g><text x="471" y="97" fill="#111" font-size="12" font-weight="600">WAN-only switch</text><text x="471" y="118" fill="#111" font-size="9" font-family="monospace">No LAN devices here</text></g><g data-node="home" color="#111"><rect x="50" y="315" width="250" height="88" fill="#fff" stroke="#111"/><g transform="translate(65 335) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 19-16 19 16M7 15v23h28V15M17 38V25h8v13"/></g><text x="111" y="351" fill="#111" font-size="12" font-weight="600">Home router</text><text x="111" y="372" fill="#111" font-size="9" font-family="monospace">WAN: ISP assigned</text></g><g data-node="firewall" color="#111"><rect x="605" y="315" width="235" height="88" fill="#fff" stroke="#111"/><g transform="translate(620 335) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 38 10v13q-2 10-17 17Q6 33 4 23V10z"/><path d="m12 21 6 6 12-13"/></g><text x="666" y="351" fill="#111" font-size="12" font-weight="600">Trusted firewall</text><text x="666" y="372" fill="#111" font-size="9" font-family="monospace">pfSense</text></g><g data-node="target" color="#111"><rect x="895" y="315" width="175" height="88" fill="#fff" stroke="#111"/><g transform="translate(910 335) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="28" height="36"/><path d="M7 14h28M7 26h28M13 8h3m-3 12h3m-3 12h3m7-24h6m-6 12h6m-6 12h6"/></g><text x="956" y="351" fill="#111" font-size="12" font-weight="600">Lab targets</text><text x="956" y="372" fill="#111" font-size="9" font-family="monospace">10.77.10.0/24</text></g><text x="670" y="85" font-size="12">Conditional: ISP must allow both routers.</text><text x="670" y="108" font-size="10">An unmanaged switch does not create public IPs.</text><text x="348" y="324" font-size="11">× No LAN bridge</text><text x="349" y="347" font-size="10">Keep both WANs</text><text x="349" y="365" font-size="10">default-deny.</text><text x="605" y="425" font-size="9">MGMT / RELAY / SERVICES: separate internal zones</text><text x="25" y="490" font-size="10" fill="#555">PUBLIC EXAMPLE · ALL ADDRESSES FICTIONAL · Separate ISP branches</text></svg>
