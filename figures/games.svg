<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Host a game — Site A</title><desc id="diagram-desc">Minecraft or Factorio runs on a suitable Linux computer in a separate services zone. Participants connect to its private overlay address, with game ports explicitly allowed.</desc><rect width="1100" height="470" fill="white"/><rect x="20" y="260" width="275" height="175" fill="#f5f5f3" stroke="#bbb"/><text x="35" y="284" font-size="9" font-family="monospace" letter-spacing="1.2">HOME / PROTECTED</text><rect x="705" y="30" width="375" height="210" fill="#f5f5f3" stroke="#bbb"/><text x="720" y="54" font-size="9" font-family="monospace" letter-spacing="1.2">CLEAN SERVICES ZONE</text><rect x="705" y="260" width="375" height="175" fill="#f5f5f3" stroke="#bbb"/><text x="720" y="284" font-size="9" font-family="monospace" letter-spacing="1.2">SEPARATE ATTACK ZONE</text><path d="M257 137 L408 137" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="6 5"/><text x="332.5" y="127" text-anchor="middle" font-size="9" fill="#555">Encrypted tunnel</text><path d="M603 137 L765 137" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="6 5"/><text x="684" y="127" text-anchor="middle" font-size="9" fill="#555">Game ports only</text><path d="M508 181 L508 336" fill="none" stroke="#111" stroke-width="1.3" /><path d="M247 371 L408 371" fill="none" stroke="#111" stroke-width="1.3" /><text x="327.5" y="361" text-anchor="middle" font-size="9" fill="#555">Uplink</text><path d="M603 371 L765 371" fill="none" stroke="#111" stroke-width="1.3" /><path d="M862 181 L862 248" fill="none" stroke="#111" stroke-width="1.3" /><path d="M862 248 L645 248" fill="none" stroke="#111" stroke-width="1.3" /><text x="753.5" y="238" text-anchor="middle" font-size="9" fill="#555">Services interface</text><path d="M645 248 L645 371" fill="none" stroke="#111" stroke-width="1.3" /><path d="M645 371 L603 371" fill="none" stroke="#111" stroke-width="1.3" /><g data-node="remote" color="#111"><rect x="62" y="93" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(77 113) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="30" height="23" rx="1"/><path d="M6 28 2 35h38l-4-7M17 32h8"/></g><text x="123" y="129" fill="#111" font-size="12" font-weight="600">Approved player</text><text x="123" y="150" fill="#111" font-size="9" font-family="monospace">Individual identity</text></g><g data-node="internet" color="#111"><rect x="408" y="93" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(423 113) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="18"/><ellipse cx="21" cy="21" rx="8" ry="18"/><path d="M3 21h36M7 10h28M7 32h28"/></g><text x="469" y="129" fill="#111" font-size="12" font-weight="600">Private overlay</text><text x="469" y="150" fill="#111" font-size="9" font-family="monospace">No public game forward</text></g><g data-node="game" color="#111"><rect x="765" y="93" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(780 113) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="28" height="36"/><path d="M7 14h28M7 26h28M13 8h3m-3 12h3m-3 12h3m7-24h6m-6 12h6m-6 12h6"/></g><text x="826" y="129" fill="#111" font-size="12" font-weight="600">Linux game server</text><text x="826" y="150" fill="#111" font-size="9" font-family="monospace">TCP 25565 / UDP 34197</text></g><g data-node="home" color="#111"><rect x="52" y="327" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(67 347) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 19-16 19 16M7 15v23h28V15M17 38V25h8v13"/></g><text x="113" y="363" fill="#111" font-size="12" font-weight="600">Home router</text><text x="113" y="384" fill="#111" font-size="9" font-family="monospace">Home network</text></g><g data-node="firewall" color="#111"><rect x="408" y="327" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(423 347) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 38 10v13q-2 10-17 17Q6 33 4 23V10z"/><path d="m12 21 6 6 12-13"/></g><text x="469" y="363" fill="#111" font-size="12" font-weight="600">Trusted firewall</text><text x="469" y="384" fill="#111" font-size="9" font-family="monospace">Separate services zone</text></g><g data-node="target" color="#111"><rect x="765" y="327" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(780 347) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="2" width="22" height="36" rx="2"/><rect x="16" y="15" width="10" height="10"/><path d="M16 2v6h10V2M5 11h5m-5 7h5m-5 7h5m-5 7h5m22-21h5m-5 7h5m-5 7h5m-5 7h5"/></g><text x="826" y="363" fill="#111" font-size="12" font-weight="600">Experiment targets</text><text x="826" y="384" fill="#111" font-size="9" font-family="monospace">10.77.10.0/24</text></g><text x="704" y="355" text-anchor="middle" font-size="24">×</text><text x="770" y="218" font-size="10">Bind to the approved overlay address.</text><text x="25" y="490" font-size="10" fill="#555">PUBLIC EXAMPLE · ALL ADDRESSES FICTIONAL · Host a game</text></svg>
