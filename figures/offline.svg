<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Offline bench — Site A</title><desc id="diagram-desc">An independent lab has no cable or wireless route to the home network or internet. Suitable for the first router and microcontroller experiments.</desc><rect width="1100" height="470" fill="white"/><rect x="20" y="30" width="270" height="405" fill="#f5f5f3" stroke="#bbb"/><text x="35" y="54" font-size="9" font-family="monospace" letter-spacing="1.2">HOME / OUTSIDE THE LAB</text><rect x="340" y="30" width="740" height="405" fill="#f5f5f3" stroke="#bbb"/><text x="355" y="54" font-size="9" font-family="monospace" letter-spacing="1.2">ISOLATED BENCH / NO UPLINK</text><path d="M390 182 L660 182" fill="none" stroke="#111" stroke-width="1.3" /><text x="525" y="172" text-anchor="middle" font-size="9" fill="#555">Local Ethernet / lab Wi-Fi</text><path d="M855 182 L945 182" fill="none" stroke="#111" stroke-width="1.3" /><path d="M755 226 L755 327" fill="none" stroke="#111" stroke-width="1.3" /><text x="755" y="266.5" text-anchor="middle" font-size="9" fill="#555">LAN only</text><g data-node="home" color="#111"><rect x="55" y="142" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(70 162) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 19 19-16 19 16M7 15v23h28V15M17 38V25h8v13"/></g><text x="116" y="178" fill="#111" font-size="12" font-weight="600">Home router</text><text x="116" y="199" fill="#111" font-size="9" font-family="monospace">Ordinary home devices</text></g><g data-node="client" color="#111"><rect x="365" y="138" width="195" height="88" fill="#fff" stroke="#111"/><g transform="translate(380 158) scale(0.85)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="30" height="23" rx="1"/><path d="M6 28 2 35h38l-4-7M17